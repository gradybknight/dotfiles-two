# gitmux — git status for the tmux status bar (https://github.com/arl/gitmux)
# Symlinked to ~/.gitmux.conf; rendered by catppuccin's `gitmux` status module.
# Colours are Catppuccin Mocha to match the rest of the bar.
tmux:
    symbols:
        branch: " "
        hashprefix: ":"
        ahead: "⇡"
        behind: "⇣"
        staged: "● "
        conflict: "✖ "
        modified: "✚ "
        untracked: "… "
        stashed: "⚑ "
        clean: "✔"
    styles:
        clean: "#[fg=#a6e3a1]"
        state: "#[fg=#f38ba8,bold]"
        branch: "#[fg=#cdd6f4,bold]"
        remote: "#[fg=#94e2d5]"
        divergence: "#[fg=#f9e2af]"
        staged: "#[fg=#a6e3a1]"
        conflict: "#[fg=#f38ba8]"
        modified: "#[fg=#fab387]"
        untracked: "#[fg=#cba6f7]"
        stashed: "#[fg=#94e2d5]"
    layout: [branch, divergence, " ", flags]
    options:
        branch_max_len: 0
        branch_trim: right
        ellipsis: …
        hide_clean: false
