source-file ~/.config/tmux/tmux.reset.conf

# Terminal / colour: assume a modern true-colour terminal (Ghostty).
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB,*:RGB"
set -g focus-events on           # let nvim see focus in/out (autoread, etc.)

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g pane-base-index 1         # ...and panes
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g status-interval 1         # re-run gitmux every 1s so it tracks the shell prompt
setw -g mode-keys vi

set -g mouse on

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux#v2.1.2' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '~/git/dotfiles-two'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/git/dotfiles-two'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# ~~~~~~~~~~~~~~~ Catppuccin status bar (tmux plugin v2.1.x) ~~~~~~~~
# v2 removed @catppuccin_status_modules_* and the *_fill options — the
# status line is assembled by hand at the bottom, *after* `run tpm`.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'default'   # paint the whole bar (theme mantle)

# Windows: rounded "pills" — «1 name», active window number in mauve
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_window_flags 'icon'           # zoom / activity / bell markers
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Spacing between status modules (rounded end-caps come from the theme)
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ''
set -g @catppuccin_status_middle_separator ' '
set -g @catppuccin_status_connect_separator 'no'

# Module contents
set -g @catppuccin_directory_text ' #{b:pane_current_path}'
set -g @catppuccin_date_time_text ' %a %b %-d  %H:%M'

run '~/.config/tmux/plugins/tpm/tpm'

# ---- Assemble the bar (AFTER tpm, so the catppuccin modules exist) ----
set -g status-justify 'left'
set -g status-left-length 100
set -g status-right-length 150
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right ''
set -ag status-right '#{E:@catppuccin_status_gitmux}'
set -ag status-right '#{E:@catppuccin_status_directory}'
set -ag status-right '#{E:@catppuccin_status_date_time}'
